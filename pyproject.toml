[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "AtomSpect"
version = "0.1.0.dev0"
description = "Zeeman and hyperfine spectra for plasma diagnostics"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
# Minimum versions are tested in CI (job "minimum-versions"); newer releases are tested too.
dependencies = ["numpy>=1.23", "scipy>=1.9", "sympy>=1.10", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["AtomSpect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning"]
